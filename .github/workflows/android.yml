name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the app
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the useful part of the failure as an annotation, readable without the full log
            msg=$( { grep -E '^e: |error:|ERROR|What went wrong|^> ' build.log; grep -A8 'What went wrong' build.log; } | head -60 )
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Build failed::$msg"
          fi
          exit $status

      - name: Publish the app to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YenDollar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest YenDollar.apk \
            --target "$GITHUB_SHA" \
            --title "Yen to Dollar (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap YenDollar.apk to download and install. New builds install over the old one."
