name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the app
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish the app to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk YenDollar.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest YenDollar.apk \
            --target "$GITHUB_SHA" \
            --title "Yen to Dollar (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap YenDollar.apk to download and install. New builds install over the old one."
